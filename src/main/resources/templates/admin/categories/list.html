<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý danh mục')}"></head>
<body>
<nav th:replace="~{fragments/layout :: adminNav('categories')}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h3 class="fw-bold mb-0"><i class="bi bi-tags"></i> Quản lý danh mục</h3>
        <a th:href="@{/admin/categories/new}" class="btn btn-accent"><i class="bi bi-plus-lg"></i> Thêm danh mục</a>
    </div>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Tên danh mục</th>
                    <th>Mô tả</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${categories.isEmpty()}"><td colspan="5" class="text-center text-secondary py-4">Chưa có danh mục nào.</td></tr>
                <tr th:each="c : ${categories}">
                    <td th:text="${c.categoryId}">1</td>
                    <td class="fw-semibold text-uppercase" th:text="${c.categoryName}">Tên</td>
                    <td class="text-secondary" th:text="${c.description}">Mô tả</td>
                    <td>
                        <span class="badge" th:classappend="${c.status == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${c.status == 'ACTIVE'} ? 'Hiển thị' : 'Ẩn'">ACTIVE</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/categories/{id}/edit(id=${c.categoryId})}"><i class="bi bi-pencil"></i></a>
                        <form class="d-inline" th:action="@{/admin/categories/{id}/delete(id=${c.categoryId})}" method="post"
                              onsubmit="return confirm('Bạn chắc chắn muốn xóa danh mục này?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
