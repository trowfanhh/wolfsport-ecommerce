<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản trị danh mục')}"></head>
<body>
<nav th:replace="~{fragments/layout :: adminNav('categories')}"></nav>

<main class="container py-4" style="max-width: 640px;">
    <h3 class="fw-bold mb-3" th:text="${categoryId == null} ? 'Thêm danh mục mới' : 'Chỉnh sửa danh mục'">Danh mục</h3>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="${categoryId == null} ? @{/admin/categories} : @{/admin/categories/{id}(id=${categoryId})}"
                  th:object="${category}" method="post" novalidate>

                <div class="mb-3">
                    <label class="form-label" for="categoryName">Tên danh mục <span class="text-danger">*</span></label>
                    <input type="text" id="categoryName" class="form-control" th:field="*{categoryName}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{categoryName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="description">Mô tả</label>
                    <textarea id="description" class="form-control" rows="4" th:field="*{description}"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="status">Trạng thái</label>
                    <select id="status" class="form-select" th:field="*{status}">
                        <option value="ACTIVE">Hiển thị (ACTIVE)</option>
                        <option value="INACTIVE">Ẩn (INACTIVE)</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent"><i class="bi bi-check-lg"></i> Lưu</button>
                    <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
