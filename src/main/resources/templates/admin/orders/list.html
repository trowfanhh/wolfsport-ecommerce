<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý đơn hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: adminNav('orders')}"></nav>

<main class="container py-4">
    <h3 class="fw-bold mb-3"><i class="bi bi-receipt"></i> Quản lý đơn hàng</h3>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- Lọc theo trạng thái -->
    <form class="row g-2 mb-3" th:action="@{/admin/orders}" method="get">
        <div class="col-md-4">
            <select name="status" class="form-select" onchange="this.form.submit()">
                <option value="" th:selected="${status == ''}">Tất cả trạng thái</option>
                <option value="PENDING" th:selected="${status == 'PENDING'}">Chờ xác nhận</option>
                <option value="CONFIRMED" th:selected="${status == 'CONFIRMED'}">Đã xác nhận</option>
                <option value="SHIPPING" th:selected="${status == 'SHIPPING'}">Đang giao</option>
                <option value="COMPLETED" th:selected="${status == 'COMPLETED'}">Hoàn thành</option>
                <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Đã hủy</option>
            </select>
        </div>
        <div class="col-auto" th:if="${!#strings.isEmpty(status)}"><a class="btn btn-link" th:href="@{/admin/orders}">Xóa lọc</a></div>
    </form>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>Ngày đặt</th>
                    <th class="text-end">Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${orders.isEmpty()}"><td colspan="6" class="text-center text-secondary py-4">Không có đơn hàng nào.</td></tr>
                <tr th:each="o : ${orders}">
                    <td class="fw-semibold">#<span th:text="${o.orderId}">1</span></td>
                    <td>
                        <div th:text="${o.receiverName}">Tên người nhận</div>
                        <div class="small text-secondary" th:text="${o.user.email}">email</div>
                    </td>
                    <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                    <td class="text-end"><span th:replace="~{fragments/layout :: price(${o.totalAmount})}"></span></td>
                    <td><span class="badge" th:classappend="${o.statusBadge}" th:text="${o.statusLabel}">Trạng thái</span></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/orders/{id}(id=${o.orderId})}"><i class="bi bi-eye"></i> Xem</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${page.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${page.number - 1}, status=${status})}">&laquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/orders(page=${i}, status=${status})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/orders(page=${page.number + 1}, status=${status})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
