<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết đơn hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: adminNav('orders')}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h3 class="fw-bold mb-0">
            Đơn hàng #<span th:text="${order.orderId}">1</span>
            <span class="badge fs-6 align-middle" th:classappend="${order.statusBadge}" th:text="${order.statusLabel}">Trạng thái</span>
        </h3>
        <a th:href="@{/admin/orders}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Danh sách đơn hàng</a>
    </div>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Sản phẩm</th>
                            <th class="text-end">Đơn giá</th>
                            <th class="text-center">Số lượng</th>
                            <th class="text-end">Thành tiền</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.items}">
                            <td class="title-case" th:text="${item.productName}">Tên</td>
                            <td class="text-end"><span th:replace="~{fragments/layout :: price(${item.unitPrice})}"></span></td>
                            <td class="text-center" th:text="${item.quantity}">1</td>
                            <td class="text-end fw-semibold"><span th:replace="~{fragments/layout :: price(${item.subtotal})}"></span></td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <td colspan="3" class="text-end fw-bold">Tổng tiền</td>
                            <td class="text-end fs-5 price"><span th:replace="~{fragments/layout :: price(${order.totalAmount})}"></span></td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Khách hàng & giao hàng</h5>
                    <p class="mb-1"><i class="bi bi-person-badge"></i> Tài khoản: <span th:text="${order.user.email}">email</span></p>
                    <p class="mb-1"><i class="bi bi-person"></i> <span th:text="${order.receiverName}">Tên</span></p>
                    <p class="mb-1"><i class="bi bi-telephone"></i> <span th:text="${order.receiverPhone}">SĐT</span></p>
                    <p class="mb-1"><i class="bi bi-geo-alt"></i> <span th:text="${order.shippingAddress}">Địa chỉ</span></p>
                    <p class="mb-1 text-secondary" th:if="${order.note != null}"><i class="bi bi-chat-left-text"></i> <span th:text="${order.note}">Ghi chú</span></p>
                    <p class="mb-0 small text-secondary">Đặt lúc <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</span></p>
                </div>
            </div>

                        <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Cập nhật trạng thái</h5>
                    <p class="text-secondary mb-0" th:if="${order.nextStatuses.isEmpty()}">Đơn hàng đã ở trạng thái cuối, không thể thay đổi.</p>
                    <div class="d-grid gap-2" th:if="${!order.nextStatuses.isEmpty()}">
                        <th:block th:each="s : ${order.nextStatuses}">

                            <!-- Hủy đơn: có hộp thoại xác nhận -->
                            <form th:if="${s == 'CANCELLED'}" th:action="@{/admin/orders/{id}/status(id=${order.orderId})}" method="post"
                                  onsubmit="return confirm('Hủy đơn hàng này? Tồn kho sẽ được hoàn lại.');">
                                <input type="hidden" name="status" value="CANCELLED">
                                <button type="submit" class="btn btn-outline-danger w-100">Hủy đơn hàng</button>
                            </form>

                            <!-- Các bước chuyển trạng thái còn lại -->
                            <form th:if="${s != 'CANCELLED'}" th:action="@{/admin/orders/{id}/status(id=${order.orderId})}" method="post">
                                <input type="hidden" name="status" th:value="${s}">
                                <button type="submit" class="btn btn-accent w-100"
                                        th:text="${'Chuyển sang: ' + (s == 'CONFIRMED' ? 'Đã xác nhận' : (s == 'SHIPPING' ? 'Đang giao' : 'Hoàn thành'))}">Chuyển</button>
                            </form>

                        </th:block>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
