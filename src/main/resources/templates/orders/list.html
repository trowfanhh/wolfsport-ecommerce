<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đơn hàng của tôi')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <h3 class="fw-bold mb-3"><i class="bi bi-receipt"></i> Đơn hàng của tôi</h3>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div th:if="${orders.isEmpty()}" class="text-center py-5">
        <i class="bi bi-receipt-cutoff display-1 text-secondary"></i>
        <p class="lead mt-3">Bạn chưa có đơn hàng nào.</p>
        <a th:href="@{/products}" class="btn btn-accent">Mua sắm ngay</a>
    </div>

    <div th:if="${!orders.isEmpty()}" class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã đơn</th>
                    <th>Ngày đặt</th>
                    <th>Người nhận</th>
                    <th class="text-end">Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td class="fw-semibold">#<span th:text="${o.orderId}">1</span></td>
                    <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                    <td th:text="${o.receiverName}">Tên</td>
                    <td class="text-end"><span th:replace="~{fragments/layout :: price(${o.totalAmount})}"></span></td>
                    <td><span class="badge" th:classappend="${o.statusBadge}" th:text="${o.statusLabel}">Trạng thái</span></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/orders/{id}(id=${o.orderId})}">Xem</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
