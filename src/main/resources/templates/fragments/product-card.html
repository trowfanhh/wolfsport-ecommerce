<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Thẻ sản phẩm dùng chung ở trang chủ, danh sách và sản phẩm liên quan -->
<div th:fragment="card(p)" class="col">
    <div class="card h-100 border-0 shadow-sm product-card">
        <a th:href="@{/products/{id}(id=${p.productId})}">
            <img class="card-img-top product-img"
                 th:src="${p.imageSrc}"
                 th:alt="${p.productName}"
                 onerror="this.onerror=null;this.src='/images/no-image.svg'">
        </a>
        <div class="card-body d-flex flex-column">
            <div class="small text-secondary mb-1 text-uppercase" th:text="${p.category.categoryName}">Danh mục</div>
            <h6 class="card-title product-name">
                <a class="text-decoration-none text-dark" th:href="@{/products/{id}(id=${p.productId})}" th:text="${p.productName}">Tên</a>
            </h6>
            <div class="mt-auto">
                <div class="price fs-5 mb-2"><span th:replace="~{fragments/layout :: price(${p.price})}"></span></div>
                <a class="btn btn-sm btn-outline-accent w-100" th:href="@{/products/{id}(id=${p.productId})}">Xem chi tiết</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
