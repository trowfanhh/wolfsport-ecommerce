<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giỏ hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <h3 class="fw-bold mb-3"><i class="bi bi-cart3"></i> Giỏ hàng của bạn</h3>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div th:if="${cart.items.isEmpty()}" class="text-center py-5">
        <i class="bi bi-cart-x display-1 text-secondary"></i>
        <p class="lead mt-3">Giỏ hàng đang trống.</p>
        <a th:href="@{/products}" class="btn btn-accent">Tiếp tục mua sắm</a>
    </div>

    <div th:if="${!cart.items.isEmpty()}" class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Sản phẩm</th>
                            <th class="text-end">Đơn giá</th>
                            <th class="text-center" style="width: 190px;">Số lượng</th>
                            <th class="text-end">Thành tiền</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${cart.items}">
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <img class="cart-img"
                                         th:src="${item.product.imageSrc}"
                                         th:alt="${item.product.productName}"
                                         onerror="this.onerror=null;this.src='/images/no-image.svg'">
                                    <div>
                                        <a class="fw-semibold text-decoration-none text-dark title-case"
                                           th:href="@{/products/{id}(id=${item.product.productId})}" th:text="${item.product.productName}">Tên</a>
                                        <div class="small text-secondary" th:if="${item.product.status != 'ACTIVE'}">Sản phẩm đã ngừng bán</div>
                                        <div class="small text-danger" th:if="${item.quantity > item.product.stockQuantity}">
                                            Chỉ còn <span th:text="${item.product.stockQuantity}">0</span> trong kho
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td class="text-end"><span th:replace="~{fragments/layout :: price(${item.product.price})}"></span></td>
                            <td>
                                <form th:action="@{/cart/update}" method="post" class="d-flex gap-1 justify-content-center">
                                    <input type="hidden" name="cartItemId" th:value="${item.cartItemId}">
                                    <input type="number" name="quantity" min="1" th:value="${item.quantity}"
                                           class="form-control form-control-sm" style="width: 80px;">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary" title="Cập nhật"><i class="bi bi-arrow-repeat"></i></button>
                                </form>
                            </td>
                            <td class="text-end fw-semibold"><span th:replace="~{fragments/layout :: price(${item.subtotal})}"></span></td>
                            <td class="text-end">
                                <form th:action="@{/cart/remove}" method="post" onsubmit="return confirm('Xóa sản phẩm này khỏi giỏ hàng?');">
                                    <input type="hidden" name="cartItemId" th:value="${item.cartItemId}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <a th:href="@{/products}" class="btn btn-link mt-2"><i class="bi bi-arrow-left"></i> Tiếp tục mua sắm</a>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Tổng cộng</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Số lượng sản phẩm</span>
                        <span th:text="${cart.totalQuantity}">0</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fs-5 fw-bold">
                        <span>Tổng tiền</span>
                        <span class="price"><span th:replace="~{fragments/layout :: price(${cart.total})}"></span></span>
                    </div>
                    <p class="small text-secondary mt-3 mb-0">Chức năng đặt hàng / thanh toán sẽ được bổ sung ở giai đoạn sau.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
