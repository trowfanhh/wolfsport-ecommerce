<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h4 class="fw-bold text-center mb-4">Đăng ký tài khoản</h4>

                    <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>

                        <div class="mb-3">
                            <label class="form-label" for="fullName">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" id="fullName" class="form-control" th:field="*{fullName}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email">Email <span class="text-danger">*</span></label>
                            <input type="email" id="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" id="password" class="form-control" th:field="*{password}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="confirmPassword">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="phone">Số điện thoại</label>
                            <input type="text" id="phone" class="form-control" th:field="*{phone}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="address">Địa chỉ</label>
                            <input type="text" id="address" class="form-control" th:field="*{address}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{address}"></div>
                        </div>

                        <button type="submit" class="btn btn-accent w-100">Đăng ký</button>
                    </form>

                    <p class="text-center mt-3 mb-0 small">
                        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
