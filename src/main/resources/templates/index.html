<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trang chủ')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <section class="hero p-4 p-md-5 mb-5">
        <h1 class="display-5 fw-bold">Trang bị cho mọi cuộc chơi</h1>
        <p class="lead mb-4">Dụng cụ thể thao chính hãng</p>
        <a th:href="@{/products}" class="btn btn-accent btn-lg"><i class="bi bi-bag"></i> Mua sắm ngay</a>
    </section>

    <section class="mb-5" th:if="${!categories.isEmpty()}">
        <h4 class="fw-bold mb-3">Danh mục sản phẩm</h4>
        <div class="row row-cols-2 row-cols-md-4 g-3">
            <div class="col" th:each="c : ${categories}">
                <a th:href="@{/products(categoryId=${c.categoryId})}" class="text-decoration-none">
                    <div class="card category-tile shadow-sm h-100">
                        <div class="card-body">
                            <div class="fw-semibold text-dark text-uppercase" th:text="${c.categoryName}">Danh mục</div>
                            <div class="small text-secondary text-truncate" th:text="${c.description}"></div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <section>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">Sản phẩm mới</h4>
            <a th:href="@{/products}" class="text-decoration-none">Xem tất cả <i class="bi bi-arrow-right"></i></a>
        </div>
        <div th:if="${products.isEmpty()}" class="alert alert-info">Chưa có sản phẩm nào.</div>
        <div class="row row-cols-2 row-cols-md-4 g-3">
            <th:block th:each="p : ${products}">
                <div th:replace="~{fragments/product-card :: card(${p})}"></div>
            </th:block>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
